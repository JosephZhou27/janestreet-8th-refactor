[project]
name = "janestreet"
version = "0.1.0"
description = "8th-place solution to the Jane Street Real-Time Market Data Forecasting Kaggle competition (refactored fork)"
authors = [{ name = "Evgeniia Volkova", email = "eivolkova3@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "polars==1.9.0",
    "scikit-learn>=1.5.2,<2",
    "numpy==1.26.4",
    "pandas>=2.2.3,<3",
    "matplotlib>=3.9.2,<4",
    "tqdm>=4.66.5,<5",
    "wandb>=0.18.5,<0.19",
    "python-dotenv>=1.0.1,<2",
    "kaggle>=1.6.17,<2",
    "grpcio>=1.67.0,<2",
    "pyarrow>=17.0.0,<18",
    "pytz>=2024.2,<2025",
    "torch==2.4.0",
    "torch-optimizer==0.3.0",
    "pydantic-settings>=2.15.0,<3.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5,<7",
    "mypy>=2.4.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "G", "LOG"]

[tool.mypy]
python_version = "3.10"
files = ["janestreet"]
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["janestreet.models.nn", "janestreet.pipeline"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["joblib", "pandas"]
ignore_missing_imports = true